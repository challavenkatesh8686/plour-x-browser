<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Addresses Electron's "Insecure Content-Security-Policy" dev warning
      (the chrome window had none set at all). Deliberately not maximally
      strict -- 'unsafe-inline' is kept for script/style because Vite's dev
      client and HMR overlay need it, and tightening further needs separate
      dev/prod CSPs (Vite doesn't template index.html by default). This is
      still a real improvement over no policy: it blocks arbitrary
      <object>/<embed> plugin content and frame embedding, and constrains
      script/style/connect origins to this app's own origin plus https.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com; style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://www.gstatic.com https://fonts.gstatic.com; connect-src 'self' https: wss: ws:; object-src 'none'; frame-src 'self' https://translate.google.com;"
    />
    <link rel="icon" type="image/png" href="/plourx-logo.png" />
    <link rel="apple-touch-icon" href="/plourx-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PlourX Browser</title>
      <style>
      #boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#0f0b1a;transition:opacity .25s ease}
      :root[data-theme='light'] #boot{background:#fdf5fb}
      #boot.hide{opacity:0;pointer-events:none}
      #boot img{width:84px;height:84px;border-radius:50%;box-shadow:0 0 48px rgba(232,72,158,.45);animation:boot-pulse 1.6s ease-in-out infinite}
      #boot .bar{width:96px;height:3px;border-radius:3px;background:rgba(147,51,234,.25);overflow:hidden}
      #boot .bar::after{content:'';display:block;width:40%;height:100%;border-radius:3px;background:#e8489e;animation:boot-slide 1.1s ease-in-out infinite}
      @keyframes boot-pulse{50%{transform:scale(.92);opacity:.85}}
      @keyframes boot-slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><img src="/PlourX-logo.png" alt="" /><div class="bar"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
